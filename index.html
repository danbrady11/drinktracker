<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drink Tracker</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Drinks">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #121212;
    --muted: #6b6b6b;
    --bg: #ffffff;
    --card: #ffffff;
    --soft: #f3f3f3;
    --l0: #b5d84c; /* no drinks */
    --l1: #fde047; /* 1-2 */
    --l2: #f6a03a; /* 3-5 */
    --l3: #e8453c; /* 6+ */
    --l4: #3a3d4a; /* blackout */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Nunito", ui-rounded, system-ui, sans-serif;
    font-weight: 800;
    padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 10px);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .year { display: flex; align-items: center; gap: 4px; }
  .year h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: .5px; min-width: 62px; text-align: center; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 12px; border: 2.5px solid var(--ink);
    background: var(--card); display: grid; place-items: center; font-size: 18px; line-height: 1; padding: 0; flex: none;
  }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .chunky {
    border: 2.5px solid var(--ink); border-radius: 14px; font-weight: 900;
    box-shadow: 0 3px 0 var(--ink); background: var(--card);
  }
  .chunky:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .today-btn { background: var(--l0); padding: 7px 12px; font-size: 15px; }
  .head-right { display: flex; align-items: center; gap: 8px; }
  .pick { position: relative; width: 40px; height: 38px; padding: 0; font-size: 19px; }
  .pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }

  .recent-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 0 0 4px; }
  .recent { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 14px; }
  .rday { border: 2.5px solid var(--ink); border-radius: 12px; background: var(--card); padding: 4px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .rday small { font-size: 10px; color: var(--muted); line-height: 1; }
  .rday b { font-size: 15px; line-height: 1; }
  .rday .sw { width: 22px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; }
  .rday.today { box-shadow: 0 3px 0 var(--ink); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .stat { border: 2.5px solid var(--ink); border-radius: 12px; padding: 4px 2px; text-align: center; }
  .stat b { display: block; font-size: 18px; font-weight: 900; line-height: 1.1; }
  .stat span { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }

  .months { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; margin: 0 auto; }
  .month h2 { margin: 0 0 1px; text-align: center; font-size: 10px; font-weight: 900; letter-spacing: .2px; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 1px; font-size: 7px; text-align: center; margin-bottom: 1px; }
  .month svg { display: block; width: 100%; height: auto; overflow: visible; }
  .month svg rect.day { cursor: pointer; }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; margin: 12px 0 0; font-size: 12px; }
  .legend div { display: flex; align-items: center; gap: 4px; }
  .legend .sw { width: 13px; height: 13px; border-radius: 4px; border-width: 2px; }
  .sw { width: 20px; height: 20px; border-radius: 5px; border: 2.5px solid var(--ink); flex: none; }
  .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; font-weight: 700; }

  .backup { display: flex; justify-content: center; gap: 14px; margin-top: 4px; font-size: 11px; }
  .backup button, .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px; }

  /* Bottom sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 92vh; overflow-y: auto;
    background: var(--card); border: 2.5px solid var(--ink); border-bottom: 0; border-radius: 22px 22px 0 0;
    padding: 16px 16px calc(env(safe-area-inset-bottom) + 18px);
    transform: translateY(105%); visibility: hidden; transition: transform .22s ease-out, visibility 0s .22s;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; visibility: visible; transition: transform .22s ease-out; }
  .sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .sheet-head h3 { margin: 0; font-size: 19px; font-weight: 900; text-align: center; flex: 1; }

  .total { display: flex; align-items: center; gap: 12px; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
  .total .sw { width: 34px; height: 34px; border-radius: 9px; }
  .total b { font-size: 26px; font-weight: 900; line-height: 1; }
  .total small { display: block; color: var(--muted); font-size: 13px; }

  .drinks { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
  .drinks li { display: flex; align-items: center; gap: 10px; border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 8px 8px 12px; }
  .drinks .emoji { font-size: 22px; }
  .drinks .info { flex: 1; line-height: 1.2; background: none; border: 0; padding: 0; text-align: left; font-weight: 800; }
  .drinks .info small::after { content: " · tap to edit"; }
  .drinks .info small { display: block; color: var(--muted); font-size: 13px; }
  .drinks .del { width: 32px; height: 32px; border-radius: 10px; border: 0; background: var(--soft); font-size: 16px; }
  .empty { color: var(--muted); text-align: center; font-size: 14px; margin: 4px 0 12px; }

  .add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .add-row button { padding: 12px 8px; font-size: 17px; }

  .form { border: 2.5px solid var(--ink); border-radius: 16px; padding: 12px; margin-top: 4px; }
  .form h4 { margin: 0 0 10px; font-size: 17px; font-weight: 900; }
  .form label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 10px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 2px solid var(--ink); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .chip.sel { background: var(--ink); color: #fff; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field input {
    width: 100%; font-size: 18px; font-weight: 800; border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px 10px;
    background: var(--card); -moz-appearance: textfield;
  }
  .field span { font-size: 16px; min-width: 24px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .preview { margin: 12px 0; font-size: 15px; }
  .form-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .form-actions button { padding: 11px; font-size: 16px; }
  .form-actions .primary { background: var(--l0); }

  .extras { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--l4); }
  .dry-btn { padding: 8px 12px; font-size: 15px; background: var(--l0); }
  .done { width: 100%; margin-top: 14px; padding: 12px; font-size: 17px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="year">
      <button class="icon-btn" id="prevYear" aria-label="Previous year">‹</button>
      <h1 id="yearLabel"></h1>
      <button class="icon-btn" id="nextYear" aria-label="Next year">›</button>
    </div>
    <div class="head-right">
      <label class="chunky pick" aria-label="Pick a day to edit">📅<input type="date" id="pickDay"></label>
      <button class="chunky today-btn" id="logToday">Log today</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>
  <p class="recent-title">Last 7 days — tap to edit</p>
  <section class="recent" id="recent"></section>
  <section class="months" id="months"></section>
  <section class="legend" id="legend"></section>

  <div class="backup">
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<div id="sheetRoot">
  <div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <button class="icon-btn" id="prevDay" aria-label="Previous day">‹</button>
      <h3 id="sheetTitle"></h3>
      <button class="icon-btn" id="nextDay" aria-label="Next day">›</button>
    </div>

    <div class="total" id="total"></div>
    <ul class="drinks" id="drinkList"></ul>
    <p class="empty" id="emptyMsg">Nothing logged yet.</p>

    <div class="add-row" id="addRow">
      <button class="chunky" data-add="beer">🍺 + Beer</button>
      <button class="chunky" data-add="whiskey">🥃 + Whiskey</button>
    </div>

    <div class="form" id="form" hidden>
      <h4 id="formTitle"></h4>
      <label>Size</label>
      <div class="chips" id="sizeChips"></div>
      <div class="two">
        <div>
          <label for="ozIn">Volume</label>
          <div class="field"><input id="ozIn" type="number" inputmode="decimal" step="0.1" min="0"><span>oz</span></div>
        </div>
        <div>
          <label for="abvIn">ABV</label>
          <div class="field"><input id="abvIn" type="number" inputmode="decimal" step="0.1" min="0" max="100"><span>%</span></div>
        </div>
      </div>
      <div class="preview" id="preview"></div>
      <div class="form-actions">
        <button class="chunky" id="cancelAdd">Cancel</button>
        <button class="chunky primary" id="confirmAdd">Add</button>
      </div>
    </div>

    <div class="extras">
      <button class="chunky dry-btn" id="dryBtn">✓ No drinks this day</button>
      <label class="toggle"><input type="checkbox" id="blackoutIn"> Blackout</label>
    </div>
    <p class="note">Counts are US standard drinks (0.6 oz of alcohol — e.g. a 12 oz 5% beer or a 1.5 oz shot of 40% whiskey).</p>
    <button class="chunky done" id="doneBtn">Done</button>
    <button class="link" id="clearDay" style="width:100%;margin-top:6px">Clear this day</button>
  </div>
</div>

<script>
(() => {
  const STORE_KEY = "drinktracker.v1";
  const PREFS_KEY = "drinktracker.prefs";
  const STD_OZ = 0.6; // US standard drink = 0.6 fl oz pure alcohol
  const LEVELS = [
    { label: "No Drinks", color: "var(--l0)" },
    { label: "1-2 Drinks", color: "var(--l1)" },
    { label: "3-5 Drinks", color: "var(--l2)" },
    { label: "6+ Drinks",  color: "var(--l3)" },
    { label: "Blackout",   color: "var(--l4)" },
  ];
  const TYPES = {
    beer: {
      name: "Beer", emoji: "🍺", oz: 12, abv: 5,
      sizes: [["Can/bottle", 12], ["Pint", 16], ["Tallboy", 19.2], ["Big can", 24]],
    },
    whiskey: {
      name: "Whiskey", emoji: "🥃", oz: 1.5, abv: 35,
      sizes: [["Pour", 1], ["Shot", 1.5], ["Double", 2], ["Big pour", 3]],
    },
  };
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // ---- storage ----
  // data[YYYY-MM-DD] is either
  //   a number 0-4 (a level picked directly, from the original version), or
  //   { drinks: [{ type, oz, abv }], blackout?: true }  (empty drinks = dry day)
  const load = (k, fallback) => { try { return JSON.parse(localStorage.getItem(k)) || fallback; } catch (e) { return fallback; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let data = load(STORE_KEY, {});
  let prefs = load(PREFS_KEY, {});
  const save = () => store(STORE_KEY, data);

  const stdDrinks = d => d.oz * d.abv / 100 / STD_OZ;
  const dayTotal = e => (e && typeof e === "object") ? e.drinks.reduce((s, d) => s + stdDrinks(d), 0) : null;
  function levelOf(e) {
    if (e == null) return null;
    if (typeof e === "number") return e;
    if (e.blackout) return 4;
    const t = Math.round(dayTotal(e) * 10) / 10; // match the rounded total shown on screen
    if (t === 0) return 0;
    if (t < 2.5) return 1;
    if (t < 5.5) return 2;
    return 3;
  }
  const fmt = n => (Math.round(n * 10) / 10).toString();

  const pad = n => String(n).padStart(2, "0");
  const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const todayDate = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
  const dateKey = dt => keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate());

  let year = new Date().getFullYear();

  // ---- month shape ----
  const C = 20;   // cell size (svg units)
  const P = 3;    // padding for outline stroke
  const R = 6;    // corner radius

  // Rounded outline around the calendar "staircase" shape.
  function shapePath(start, end, rows) {
    let pts = [[start, 0], [7, 0]];
    if (end < 6) pts.push([7, rows - 1], [end + 1, rows - 1], [end + 1, rows]);
    else pts.push([7, rows]);
    pts.push([0, rows]);
    if (start > 0) pts.push([0, 1], [start, 1]);
    else pts[0] = [0, 0];
    pts = pts.map(([x, y]) => [P + x * C, P + y * C]);

    const n = pts.length;
    let d = "";
    for (let i = 0; i < n; i++) {
      const prev = pts[(i - 1 + n) % n], cur = pts[i], next = pts[(i + 1) % n];
      const inLen = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
      const outLen = Math.hypot(next[0] - cur[0], next[1] - cur[1]);
      const r = Math.min(R, inLen / 2, outLen / 2);
      const a = [cur[0] + (prev[0] - cur[0]) / inLen * r, cur[1] + (prev[1] - cur[1]) / inLen * r];
      const b = [cur[0] + (next[0] - cur[0]) / outLen * r, cur[1] + (next[1] - cur[1]) / outLen * r];
      d += (i === 0 ? `M${a[0]},${a[1]}` : `L${a[0]},${a[1]}`) + `Q${cur[0]},${cur[1]} ${b[0]},${b[1]}`;
    }
    return d + "Z";
  }

  function renderMonth(y, m, todayKey) {
    const first = new Date(y, m, 1);
    const days = new Date(y, m + 1, 0).getDate();
    const start = (first.getDay() + 6) % 7;            // Monday-first
    const end = (start + days - 1) % 7;
    const rows = Math.ceil((start + days) / 7);
    const w = 7 * C + 2 * P, h = rows * C + 2 * P;
    const path = shapePath(start, end, rows);
    const clipId = `clip-${y}-${m}`;

    let cells = "", todayMark = "";
    for (let d = 1; d <= days; d++) {
      const idx = start + d - 1, col = idx % 7, row = Math.floor(idx / 7);
      const k = keyOf(y, m, d);
      const lvl = levelOf(data[k]);
      const fill = lvl == null ? "#fff" : LEVELS[lvl].color;
      const t = dayTotal(data[k]);
      const tip = `${MONTHS[m]} ${d}` + (t ? ` · ${fmt(t)} drinks` : "");
      const x = P + col * C, yy = P + row * C;
      cells += `<rect class="day" data-key="${k}" x="${x}" y="${yy}" width="${C}" height="${C}" style="fill:${fill}" stroke="#fff" stroke-width="2.2"><title>${tip}</title></rect>`;
      if (k === todayKey) {
        todayMark = `<rect x="${x + 3}" y="${yy + 3}" width="${C - 6}" height="${C - 6}" rx="3" fill="none" stroke="${lvl === 4 ? "#fff" : "#121212"}" stroke-width="2" pointer-events="none"/>`;
      }
    }
    return `
      <div class="month">
        <h2>${MONTHS[m].toUpperCase()}</h2>
        <div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
        <svg viewBox="0 0 ${w} ${h}" aria-label="${MONTHS[m]} ${y}">
          <defs><clipPath id="${clipId}"><path d="${path}"/></clipPath></defs>
          <g clip-path="url(#${clipId})">${cells}${todayMark}</g>
          <path d="${path}" fill="none" stroke="#121212" stroke-width="2.6" stroke-linejoin="round" pointer-events="none"/>
        </svg>
      </div>`;
  }

  function renderStats() {
    const yearKeys = Object.keys(data).filter(k => k.startsWith(year + "-"));
    const dry = yearKeys.filter(k => levelOf(data[k]) === 0).length;
    const drinking = yearKeys.filter(k => levelOf(data[k]) > 0).length;
    const total = yearKeys.reduce((s, k) => s + (dayTotal(data[k]) || 0), 0);

    // Current streak of logged dry days ending today (or yesterday if today isn't logged yet).
    let streak = 0;
    const cur = todayDate();
    if (data[dateKey(cur)] == null) cur.setDate(cur.getDate() - 1);
    while (levelOf(data[dateKey(cur)]) === 0) { streak++; cur.setDate(cur.getDate() - 1); }

    document.getElementById("stats").innerHTML = `
      <div class="stat"><b>${dry}</b><span>Dry days</span></div>
      <div class="stat"><b>${drinking}</b><span>Drink days</span></div>
      <div class="stat"><b>${Math.round(total)}</b><span>Drinks</span></div>
      <div class="stat"><b>${streak}</b><span>Dry streak</span></div>`;
  }

  function renderRecent() {
    const t = todayDate(), out = [];
    for (let i = 6; i >= 0; i--) {
      const dt = new Date(t); dt.setDate(t.getDate() - i);
      const k = dateKey(dt), e = data[k], lvl = levelOf(e), tot = dayTotal(e);
      const bg = lvl == null ? "#fff" : LEVELS[lvl].color;
      const label = tot ? fmt(tot) : "";
      out.push(`<button class="rday${i === 0 ? " today" : ""}" data-key="${k}">
        <small>${dt.toLocaleDateString(undefined, { weekday: "short" })}</small><b>${dt.getDate()}</b>
        <span class="sw" style="background:${bg};color:${lvl >= 3 ? "#fff" : "#121212"}">${label}</span></button>`);
    }
    document.getElementById("recent").innerHTML = out.join("");
    document.getElementById("pickDay").max = dateKey(t);
  }

  function render() {
    renderRecent();
    document.getElementById("yearLabel").textContent = year;
    const tk = dateKey(todayDate());
    document.getElementById("months").innerHTML = MONTHS.map((_, m) => renderMonth(year, m, tk)).join("");
    renderStats();
    fit();
  }

  document.getElementById("legend").innerHTML = LEVELS
    .map(l => `<div><span class="sw" style="background:${l.color}"></span>${l.label === "No Drinks" ? "None" : l.label.replace(" Drinks", "")}</div>`).join("");

  // Shrink the calendar so the whole main screen fits without scrolling.
  function fit() {
    const g = document.getElementById("months");
    g.style.maxWidth = "";
    for (let i = 0; i < 3; i++) {
      const extra = document.documentElement.scrollHeight - window.innerHeight;
      if (extra <= 0) break;
      const w = Math.max(220, g.offsetWidth * (g.offsetHeight - extra) / g.offsetHeight);
      g.style.maxWidth = w + "px";
    }
  }
  window.addEventListener("resize", fit);
  if (document.fonts) document.fonts.ready.then(fit);

  // ---- day sheet ----
  const $ = id => document.getElementById(id);
  const root = $("sheetRoot");
  let editing = null;   // date key
  let adding = null;    // drink type being added or edited
  let editIdx = null;   // index of the drink being edited, or null when adding

  // Get the day's entry as an editable drink log (converting an old-style level if needed).
  function entryFor(k) {
    const e = data[k];
    if (e && typeof e === "object") return e;
    const fresh = { drinks: [] };
    if (e === 4) fresh.blackout = true;
    data[k] = fresh;
    return fresh;
  }

  function renderSheet() {
    const e = data[editing];
    $("sheetTitle").textContent = parseKey(editing).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    const isToday = editing >= dateKey(todayDate());
    $("nextDay").disabled = isToday;

    const lvl = levelOf(e);
    const swatch = `<span class="sw" style="background:${lvl == null ? "#fff" : LEVELS[lvl].color}"></span>`;
    if (typeof e === "number") {
      $("total").innerHTML = `${swatch}<div><b>${LEVELS[e].label}</b><small>Logged as a rough amount. Adding drinks replaces it.</small></div>`;
    } else if (e) {
      const t = dayTotal(e);
      $("total").innerHTML = `${swatch}<div><b>${fmt(t)}</b><small>standard drink${fmt(t) === "1" ? "" : "s"}${e.blackout ? " · blackout" : ""}${!e.drinks.length && !e.blackout ? " · dry day" : ""}</small></div>`;
    } else {
      $("total").innerHTML = `${swatch}<div><b>—</b><small>Not logged</small></div>`;
    }

    const drinks = (e && typeof e === "object") ? e.drinks : [];
    $("drinkList").innerHTML = drinks.map((d, i) => {
      const t = TYPES[d.type] || { name: d.type, emoji: "🍹" };
      return `<li><span class="emoji">${t.emoji}</span>
        <button class="info" data-edit="${i}">${t.name} · ${fmt(d.oz)} oz · ${fmt(d.abv)}%<small>${fmt(stdDrinks(d))} standard drinks</small></button>
        <button class="del" data-del="${i}" aria-label="Remove">✕</button></li>`;
    }).join("");
    $("emptyMsg").hidden = drinks.length > 0 || !!e;

    $("addRow").hidden = !!adding;
    $("form").hidden = !adding;
    $("dryBtn").hidden = !!adding || drinks.length > 0 || lvl === 0;
    $("blackoutIn").checked = lvl === 4;
    $("clearDay").hidden = e == null;
  }

  function openSheet(k) { editing = k; adding = null; editIdx = null; renderSheet(); root.classList.add("open"); }
  function closeSheet() { root.classList.remove("open"); editing = null; adding = null; editIdx = null; }
  function shiftDay(n) {
    const dt = parseKey(editing); dt.setDate(dt.getDate() + n);
    if (n > 0 && dt > todayDate()) return;
    editing = dateKey(dt); adding = null; editIdx = null;
    if (dt.getFullYear() !== year) { year = dt.getFullYear(); render(); }
    renderSheet();
  }
  const commit = () => { save(); render(); renderSheet(); };

  // ---- add-drink form ----
  function openForm(type, idx = null) {
    adding = type; editIdx = idx;
    const t = TYPES[type], p = idx == null ? (prefs[type] || {}) : data[editing].drinks[idx];
    $("formTitle").textContent = `${t.emoji} ${idx == null ? "Add" : "Edit"} ${t.name.toLowerCase()}`;
    $("confirmAdd").textContent = idx == null ? "Add" : "Save";
    $("ozIn").value = p.oz ?? t.oz;
    $("abvIn").value = p.abv ?? t.abv;
    updateForm();
    renderSheet();
  }
  function updateForm() {
    const t = TYPES[adding];
    const oz = parseFloat($("ozIn").value), abv = parseFloat($("abvIn").value);
    $("sizeChips").innerHTML = t.sizes.map(([label, v]) =>
      `<button class="chip${oz === v ? " sel" : ""}" data-oz="${v}">${label} · ${v} oz</button>`).join("");
    const ok = oz > 0 && abv > 0 && abv <= 100;
    $("preview").innerHTML = ok ? `= <b>${fmt(stdDrinks({ oz, abv }))}</b> standard drinks` : "Enter a volume and ABV";
    $("confirmAdd").disabled = !ok;
    $("confirmAdd").style.opacity = ok ? 1 : .4;
  }
  $("sizeChips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    $("ozIn").value = b.dataset.oz; updateForm();
  });
  $("ozIn").addEventListener("input", updateForm);
  $("abvIn").addEventListener("input", updateForm);
  $("cancelAdd").onclick = () => { adding = null; editIdx = null; renderSheet(); };
  $("confirmAdd").onclick = () => {
    const oz = parseFloat($("ozIn").value), abv = parseFloat($("abvIn").value);
    if (!(oz > 0 && abv > 0 && abv <= 100)) return;
    const drink = { type: adding, oz, abv };
    if (editIdx == null) {
      entryFor(editing).drinks.push(drink);
      prefs[adding] = { oz, abv }; store(PREFS_KEY, prefs);
    } else {
      data[editing].drinks[editIdx] = drink;
    }
    adding = null; editIdx = null;
    commit();
  };

  $("addRow").addEventListener("click", e => { const b = e.target.closest("[data-add]"); if (b) openForm(b.dataset.add); });
  $("drinkList").addEventListener("click", e => {
    const ed = e.target.closest("[data-edit]");
    if (ed) { const i = Number(ed.dataset.edit); openForm(data[editing].drinks[i].type, i); return; }
    const b = e.target.closest("[data-del]"); if (!b) return;
    data[editing].drinks.splice(Number(b.dataset.del), 1);
    adding = null; editIdx = null;
    commit();
  });
  $("dryBtn").onclick = () => { data[editing] = { drinks: [] }; commit(); };
  $("blackoutIn").onchange = e => {
    const entry = entryFor(editing);
    if (e.target.checked) entry.blackout = true; else delete entry.blackout;
    commit();
  };
  $("clearDay").onclick = () => { delete data[editing]; commit(); };
  $("doneBtn").onclick = closeSheet;
  $("scrim").onclick = closeSheet;
  $("prevDay").onclick = () => shiftDay(-1);
  $("nextDay").onclick = () => shiftDay(1);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  $("months").addEventListener("click", e => {
    const r = e.target.closest("rect.day"); if (!r) return;
    if (parseKey(r.dataset.key) > todayDate()) return; // can't log the future
    openSheet(r.dataset.key);
  });
  function openDay(k) {
    const y = parseKey(k).getFullYear();
    if (y !== year) { year = y; render(); }
    openSheet(k);
  }
  $("recent").addEventListener("click", e => { const b = e.target.closest(".rday"); if (b) openDay(b.dataset.key); });
  $("pickDay").addEventListener("change", e => {
    const k = e.target.value; e.target.value = "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && parseKey(k) <= todayDate()) openDay(k);
  });
  $("logToday").onclick = () => {
    const t = todayDate();
    if (year !== t.getFullYear()) { year = t.getFullYear(); render(); }
    openSheet(dateKey(t));
  };
  $("prevYear").onclick = () => { year--; render(); };
  $("nextYear").onclick = () => { year++; render(); };

  // ---- backup ----
  $("exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `drinktracker-${dateKey(todayDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const validEntry = v =>
    (Number.isInteger(v) && v >= 0 && v < LEVELS.length) ||
    (v && typeof v === "object" && Array.isArray(v.drinks) &&
      v.drinks.every(d => d && typeof d.type === "string" && d.oz > 0 && d.abv > 0 && d.abv <= 100));
  $("importBtn").onclick = () => $("importFile").click();
  $("importFile").onchange = async () => {
    const f = $("importFile").files[0]; if (!f) return;
    try {
      const parsed = JSON.parse(await f.text());
      let n = 0;
      for (const [k, v] of Object.entries(parsed)) {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && validEntry(v)) { data[k] = v; n++; }
      }
      save(); render();
      alert(`Imported ${n} days.`);
    } catch (e) { alert("That file doesn't look like a Drink Tracker backup."); }
    $("importFile").value = "";
  };

  // Refresh when returning to the app (e.g. the next morning).
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !editing) render(); });

  render();
})();
</script>
</body>
</html>
